<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — RFP 매트릭스</title>
<style>
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
         background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif; }
  form { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:28px 26px;
         width:min(320px, 88vw); box-shadow:0 10px 30px rgba(15,23,42,.08); }
  h1 { font-size:16px; margin:0 0 4px; }
  p.sub { color:#64748b; font-size:12.5px; margin:0 0 18px; }
  label { display:block; font-size:12.5px; font-weight:600; margin:12px 0 6px; }
  input { width:100%; padding:10px 11px; border:1px solid #e2e8f0; border-radius:8px;
          font-size:14px; box-sizing:border-box; }
  button { width:100%; margin-top:18px; padding:11px; border:0; border-radius:8px;
           background:#2a5fd6; color:#fff; font-weight:700; font-size:14px; cursor:pointer; }
  .err { color:#b91c1c; font-size:12.5px; margin:10px 0 0; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>RFP 요구사항 × 산출물 매트릭스</h1>
  <p class="sub">비공개 자료입니다. 아이디·비번을 입력하세요.</p>
  <label for="u">아이디</label>
  <input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">비밀번호</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">로그인</button>
  <p class="err" id="err" hidden>아이디 또는 비밀번호가 올바르지 않습니다.</p>
</form>
<script>
  if (new URLSearchParams(location.search).has("error")) {
    document.getElementById("err").hidden = false;
  }
</script>
</body>
</html>
