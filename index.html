<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFP 요구사항 × 산출물 매트릭스 — 고향사랑e음 클라우드 네이티브 전환</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a5fd6">
<!-- iOS는 표준 manifest를 완전히 안 따르므로 애플 전용 태그를 같이 넣는다 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RFP매트릭스">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
</head>
<body>
<header>
  <div class="head-row">
    <div>
      <h1>RFP 요구사항 × 산출물 매트릭스</h1>
      <p class="sub">고향사랑e음 클라우드 네이티브 전환 사업 · 요구사항 93건</p>
    </div>
    <button id="abbr-btn" class="ghost-btn" type="button">RFP 약어표</button>
  </div>
</header>

<dialog id="abbr-modal">
  <div class="modal-head">
    <h2>RFP 분류코드 약어표</h2>
    <button id="abbr-close" class="icon-btn" type="button" aria-label="닫기">✕</button>
  </div>
  <div class="modal-body">
    <p class="modal-note">
      영문 풀네임은 RFP 원문에 명시돼 있지 않아, 한글 뜻(분류명)을 그대로 옮긴
      <b>추정 표기</b>입니다. 한글 뜻이 원문 기준입니다.
    </p>
    <table id="abbr-table">
      <thead><tr><th>코드</th><th>영문 풀네임(추정)</th><th>한글 뜻</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</dialog>

<dialog id="detail-modal">
  <div class="modal-head">
    <div>
      <p id="detail-category" class="detail-category"></p>
      <h2 id="detail-title"></h2>
    </div>
    <button id="detail-close" class="icon-btn" type="button" aria-label="닫기">✕</button>
  </div>
  <div class="modal-body detail-body">
    <h3>요약</h3>
    <p id="detail-summary"></p>
    <h3>세부 요구사항</h3>
    <ul id="detail-list"></ul>
    <h3>검수·제출 산출물</h3>
    <p id="detail-deliverables"></p>
  </div>
</dialog>

<div class="controls">
  <input id="search" type="search" placeholder="RFP번호·요구사항·산출물 검색…" autocomplete="off">
  <select id="stage-filter">
    <option value="">단계 전체</option>
  </select>
  <span id="count" class="count"></span>
</div>

<div class="table-wrap">
  <table id="tbl">
    <thead>
      <tr>
        <th data-key="rfp" class="col-rfp">RFP번호</th>
        <th data-key="summary" class="col-req">요구사항 내용</th>
        <th data-key="deliverables" class="col-out">산출물명</th>
        <th data-key="stage" class="col-stage">단계(클라우드 네이티브 관점)</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script src="app.js"></script>
</body>
</html>
